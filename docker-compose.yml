services:
  statup:
    build: .
    # This machine only, so nobody else can create the first administrator.
    # Once it exists, "3000:3000" opens Statup to the network; behind a
    # reverse proxy on this host, keep it as is. The host port comes first.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - statup_data:/data
    # Every value in .env reaches the container. The paths and the listen
    # address below belong to the image and take precedence.
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=/data/statup.db
      - UPLOAD_DIR=/data/uploads
      - HOST=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    # The app needs no privilege: it listens above 1024 and writes to /data.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  statup_data:
