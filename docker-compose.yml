services:
  statup:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - statup_data:/data
    # Every value in .env reaches the container. The paths and the listen
    # address below belong to the image and take precedence.
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=/data/statup.db
      - UPLOAD_DIR=/data/uploads
      - HOST=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  statup_data:
