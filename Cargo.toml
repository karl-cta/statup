[package]
name = "statup"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Self-hosted status page for IT teams: services, incidents and maintenances"
authors = ["Karl"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/karl-cta/statup"
readme = "README.md"
keywords = ["status-page", "self-hosted", "incident", "htmx", "sqlite"]
categories = ["web-programming::http-server"]
publish = false

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
multer = "3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = [
    "catch-panic",
    "compression-gzip",
    "fs",
    "limit",
    "set-header",
    "timeout",
    "trace",
] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "time"] }

# Templates
askama = { version = "0.12", features = ["serde-json"] }

# Authentication
argon2 = "0.5"
tower-sessions = "0.12"
tower-sessions-sqlx-store = { version = "0.12", features = ["sqlite"] }
rmp-serde = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_html_form = "0.2"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Rate limiting
governor = "0.6"
tower_governor = "0.4"

# Markdown
pulldown-cmark = "0.10"
ammonia = "3"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1", features = ["v4"] }

# Utilities
slug = "0.1"
rand = "0.8"
async-trait = "0.1"
percent-encoding = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }

# Unoptimized, a password hash takes over a second: sign-in in a debug build
# and every test that creates an account would wait on it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
