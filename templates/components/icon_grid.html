<div id="custom-icons-grid">
    {% if let Some(message) = upload_error %}
    <div class="form-error mt-3" role="alert"><p>{{ message }}</p></div>
    {% endif %}
    {% if custom_icons.is_empty() %}
    <p class="field-hint mt-3">{{ i18n.t("icons.no_custom") }}</p>
    {% else %}
    <div class="icon-grid mt-3" role="radiogroup" aria-labelledby="custom-icons-label">
        {% for icon in custom_icons %}
        <button type="button" role="radio" class="icon-cell"
                data-icon-custom="{{ icon.id }}" data-icon-label="{{ icon.original_name }}"
                aria-label="{{ icon.original_name }}"
                aria-checked="{% if let Some(selected) = selected_icon_id %}{% if selected.eq(icon.id) %}true{% else %}false{% endif %}{% else %}false{% endif %}"
                tabindex="{% if loop.first %}0{% else %}-1{% endif %}">
            <img src="{{ icon.url() }}" alt="" loading="lazy" data-hide-on-error>
        </button>
        {% endfor %}
    </div>
    {% endif %}
</div>
