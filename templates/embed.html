<!DOCTYPE html>
{% let host = crate::instance_theme() -%}
<html lang="{{ i18n.locale() }}"
    {%- if self.is_dark() %} class="dark"{% endif %}
    {%- if let Some(accent) = host.accent.attribute() %} data-accent="{{ accent }}"{% endif %}
    {%- if let Some(ambiance) = host.ambiance.attribute() %} data-ambiance="{{ ambiance }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    {# Kept fresh without a script, which some intranets forbid in a frame. #}
    <meta http-equiv="refresh" content="60">
    <title>{{ i18n.t("dashboard.title") }}</title>
    <link rel="preload" href="/static/fonts/hanken-grotesk-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ crate::asset("css/style.css") }}">
    {% if self.follows_device() %}<script src="{{ crate::asset("js/embed-theme.js") }}"></script>{% endif %}
</head>
<body class="embed-body">
    {% include "components/embed_box.html" %}
</body>
</html>
