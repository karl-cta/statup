{# The reset email, the HTML twin of its plain text, styled like the
   notices: mail clients read a style sheet in the head, not the page's. #}
<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ words.subject }}</title>
<style>
    body { margin: 0; padding: 24px 16px; background: #ffffff; color: #1c1b18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
    .sheet { max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 12px; font-size: 20px; line-height: 1.3; font-weight: 600; }
    .text { margin: 0 0 20px; }
    .link { margin: 0 0 20px; }
    .link a { color: #1c1b18; font-weight: 600; }
    .note { margin: 0; color: #5f5c52; font-size: 14px; }
    .foot { margin: 32px 0 0; padding-top: 12px; border-top: 1px solid #e8e6e1; color: #5f5c52; font-size: 12px; }
</style>
</head>
<body>
<div class="sheet">
    <h1>{{ words.subject }}</h1>
    <p class="text">{{ words.text }}</p>
    <p class="link"><a href="{{ url }}">{{ words.action }}</a></p>
    <p class="note">{{ words.ignore }}</p>
    <p class="foot">{{ instance }}</p>
</div>
</body>
</html>
