<!DOCTYPE html>
<html lang="{{ i18n.locale() }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}{{ crate::brand_name() }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ crate::asset("logo.svg") }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ crate::asset("favicon-32.png") }}">
    <link rel="apple-touch-icon" href="{{ crate::asset("apple-touch-icon.png") }}">
    <link rel="alternate" type="application/atom+xml" href="/feed" title="{{ i18n.t("feed.title") }}">
    <link rel="preload" href="/static/fonts/hanken-grotesk-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ crate::asset("css/style.css") }}">
    <script src="{{ crate::asset("js/theme.js") }}"></script>
    {% block head %}{% endblock %}
    {# Pages that talk to the server without reloading load htmx here,
       ahead of the scripts that use it. #}
    {% block htmx %}{% endblock %}
    <script src="{{ crate::asset("js/app.js") }}" defer></script>
    {% block scripts %}{% endblock %}
</head>
<body class="grain">
    {% block body %}{% endblock %}
</body>
</html>
