<!DOCTYPE html>
<html lang="{{ i18n.locale() }}" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Statup{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="preload" href="/static/fonts/hanken-grotesk-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/style.css?v={{ crate::css_version() }}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="htmx-config" content='{"globalViewTransitions":true}'>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/custom-select.js?v={{ crate::css_version() }}" defer></script>
    <script src="/static/js/uptime-tooltip.js?v={{ crate::css_version() }}" defer></script>
    <script>
    (function(){
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    })();
    </script>
</head>
<body class="h-full bg-page dark:bg-ink text-ink dark:text-sand-light antialiased noise">
    {% block body %}{% endblock %}
    <script>
    document.body.addEventListener('htmx:configRequest', function(evt) {
        var meta = document.querySelector('meta[name="csrf-token"]');
        if (meta) { evt.detail.headers['X-CSRF-Token'] = meta.content; }
    });
    function toggleTheme() {
        var d = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', d ? 'dark' : 'light');
    }
    // Mobile burger menu, paired with #mobile-menu in _layout.html.
    // Open: toggles class on the button (icon morph), reveals the menu, listens
    // for click outside and Escape to close.
    var _mobileMenuOutside = null;
    function toggleMobileMenu(btn) {
        var m = document.getElementById('mobile-menu');
        if (!m || !btn) return;
        var willOpen = m.classList.contains('hidden');
        m.classList.toggle('hidden', !willOpen);
        btn.classList.toggle('is-open', willOpen);
        btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        if (willOpen) {
            _mobileMenuOutside = function(e) {
                if (m.contains(e.target) || btn.contains(e.target)) return;
                toggleMobileMenu(btn);
            };
            setTimeout(function() {
                document.addEventListener('click', _mobileMenuOutside);
            }, 0);
        } else if (_mobileMenuOutside) {
            document.removeEventListener('click', _mobileMenuOutside);
            _mobileMenuOutside = null;
        }
    }
    document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        var btn = document.getElementById('mast-burger');
        if (btn && btn.classList.contains('is-open')) toggleMobileMenu(btn);
    });
    // Masthead live clock and active nav marker
    (function() {
        var lang = document.documentElement.lang || 'fr';
        var dateEl = document.getElementById('mast-date');
        var clockEl = document.getElementById('mast-clock');
        if (dateEl) {
            try {
                dateEl.textContent = new Date().toLocaleDateString(lang, {
                    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                });
            } catch(e) { dateEl.textContent = new Date().toDateString(); }
        }
        function tickClock() {
            if (!clockEl) return;
            var d = new Date();
            var hh = String(d.getUTCHours()).padStart(2, '0');
            var mm = String(d.getUTCMinutes()).padStart(2, '0');
            clockEl.textContent = hh + ':' + mm + ' UTC';
        }
        tickClock();
        setInterval(tickClock, 30000);

        var path = window.location.pathname;
        var best = null, bestLen = -1;
        document.querySelectorAll('.mnav[data-nav]').forEach(function(a) {
            var p = a.getAttribute('data-nav');
            if (p === '/' && path === '/') {
                if (bestLen < 1) { best = a; bestLen = 1; }
            } else if (p !== '/' && path.indexOf(p) === 0 && p.length > bestLen) {
                best = a; bestLen = p.length;
            }
        });
        if (best) best.classList.add('active');
    })();

    // Drawer, right-side detail pane. Solid panel, transform-only animation.
    // Fetch runs in parallel with the open animation; the swap happens as soon
    // as the response is ready. The drawer is isolated via `contain: layout
    // paint style`, so the swap does not cascade into a dashboard repaint.
    var _drawerReq = 0;
    var _drawerUrl = null;
    var _drawerReturn = null;
    var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    function openDrawer(url) {
        var overlay = document.getElementById('drawer-overlay');
        var panel = document.getElementById('drawer');
        var content = document.getElementById('drawer-content');
        if (!overlay || !panel || !content) return;
        var reqId = ++_drawerReq;
        _drawerUrl = url;
        // Remember where focus came from, so closing puts it back rather than
        // dropping it on the body.
        if (!panel.contains(document.activeElement)) _drawerReturn = document.activeElement;
        content.innerHTML = '<div class="drawer-loader"><div class="drawer-spinner"></div></div>';
        panel.removeAttribute('inert');
        overlay.classList.add('open');
        panel.classList.add('open');
        // preventScroll: the panel is fixed and parked off-screen, so a plain
        // focus() makes the page jump trying to bring it into view.
        panel.focus({ preventScroll: true });
        fetch(url, { headers: { 'HX-Request': 'true' } })
            .then(function(r) {
                // Without this a 404 or a 500 would be poured into the panel as
                // if it were the event.
                if (!r.ok) throw new Error(r.status);
                return r.text();
            })
            .then(function(html) {
                if (reqId !== _drawerReq) return;
                content.innerHTML = html;
                if (window.htmx) htmx.process(content);
            })
            .catch(function() {
                if (reqId !== _drawerReq) return;
                // An empty panel with no explanation is worse than an error:
                // the reader is left with an open, silent dialog.
                content.innerHTML = '<div class="drawer-error"><p>{{ i18n.t("events.drawer_error") }}</p>'
                    + '<button type="button" class="btn-3d-ghost" onclick="retryDrawer()">{{ i18n.t("common.retry") }}</button></div>';
            });
    }
    function retryDrawer() {
        if (_drawerUrl) openDrawer(_drawerUrl);
    }
    function closeDrawer() {
        var overlay = document.getElementById('drawer-overlay');
        var panel = document.getElementById('drawer');
        if (!overlay || !panel) return;
        _drawerReq++;
        panel.classList.remove('open');
        overlay.classList.remove('open');
        // The closed panel is parked off-screen but still rendered, so without
        // this its links stay in the tab order and focus vanishes into it.
        panel.setAttribute('inert', '');
        if (_drawerReturn && document.contains(_drawerReturn)) _drawerReturn.focus();
        _drawerReturn = null;
    }
    document.addEventListener('keydown', function(e) {
        var panel = document.getElementById('drawer');
        if (e.key === 'Escape') { closeDrawer(); return; }
        if (e.key !== 'Tab' || !panel || !panel.classList.contains('open')) return;
        // A dialog that declares aria-modal must actually hold the focus.
        var items = panel.querySelectorAll(FOCUSABLE);
        if (!items.length) { e.preventDefault(); panel.focus(); return; }
        var first = items[0];
        var last = items[items.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === panel)) {
            e.preventDefault();
            last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
        }
    });
    // Delegate: any [data-drawer] click opens the drawer with that URL,
    // falling back to the href navigation if JS is disabled.
    document.addEventListener('click', function(e) {
        var el = e.target.closest('[data-drawer]');
        if (!el) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
        e.preventDefault();
        openDrawer(el.getAttribute('data-drawer'));
    });

    // Relative time, elements with data-relative-from="<ISO string>" get
    // their textContent updated every minute ("5 min ago", "hace 2 h", etc.)
    (function() {
        function fmtRelative(iso) {
            var then = Date.parse(iso);
            if (isNaN(then)) return '';
            var lang = document.documentElement.lang || 'fr';
            var rtf;
            try { rtf = new Intl.RelativeTimeFormat(lang, { numeric: 'auto' }); }
            catch (e) { return ''; }
            var diffSec = Math.max(0, Math.round((Date.now() - then) / 1000));
            if (diffSec < 60) return rtf.format(-diffSec, 'second');
            var diffMin = Math.round(diffSec / 60);
            if (diffMin < 60) return rtf.format(-diffMin, 'minute');
            var diffH = Math.round(diffSec / 3600);
            if (diffH < 24) return rtf.format(-diffH, 'hour');
            var diffD = Math.round(diffSec / 86400);
            return rtf.format(-diffD, 'day');
        }
        function updateRelatives() {
            document.querySelectorAll('[data-relative-from]').forEach(function(el) {
                var iso = el.getAttribute('data-relative-from');
                el.textContent = fmtRelative(iso);
            });
        }
        updateRelatives();
        setInterval(updateRelatives, 60000);
        document.body.addEventListener('htmx:afterSwap', updateRelatives);
    })();

    // Scroll reveal, IntersectionObserver. Skips swaps targeted at the drawer.
    (function() {
        if (!('IntersectionObserver' in window)) return;
        var io = new IntersectionObserver(function(entries) {
            entries.forEach(function(e) {
                if (e.isIntersecting) {
                    e.target.classList.add('is-visible');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px -60px 0px' });
        function observe() {
            document.querySelectorAll('.reveal:not(.is-visible)').forEach(function(el) { io.observe(el); });
        }
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', observe); } else { observe(); }
        document.body.addEventListener('htmx:afterSwap', function(e) {
            if (e.target && e.target.closest && e.target.closest('#drawer')) return;
            observe();
        });
    })();
    </script>
</body>
</html>
