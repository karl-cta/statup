name: CI

# Every commit already passes the same checks locally before it is made, so
# a draft pull request runs nothing: the checks start once it is marked ready.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TAILWIND_VERSION: v4.1.18

jobs:
  checks:
    name: Format, lint and test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  audit:
    name: Dependency advisories
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # The action publishes its report as a check on the commit.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071, rsa: listed in the lock file by the MySQL
          # driver of sqlx, which is never compiled into Statup.
          ignore: RUSTSEC-2023-0071

  stylesheet:
    name: Stylesheet builds
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -sSL -o tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tailwindcss
      - run: ./scripts/build-css.sh
      - run: test -s static/css/style.css

  browser:
    name: Browser tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: |
          curl -sSL -o tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tailwindcss
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: scripts/browser-tests.sh
      # The trace, video and screenshots of a failed journey.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 14

  # The lint and the suite on Windows Server, the only place the Windows code
  # is compiled, then the binary registered as a service, started by the
  # service manager and stopped. Only when the code or this workflow has
  # changed; if the comparison fails, it runs.
  windows:
    name: Windows tests and service
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    steps:
      # The runner checks files out with Windows line endings, which the
      # documentation test and the rendered templates would carry.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- src tests Cargo.toml Cargo.lock .github/workflows/ci.yml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.changes.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.changes.outputs.skip != 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: steps.changes.outputs.skip != 'true'
        run: cargo test --locked --no-fail-fast
      - name: Run as a Windows service
        if: steps.changes.outputs.skip != 'true'
        shell: pwsh
        run: |
          cargo build --locked
          $root = Join-Path $env:RUNNER_TEMP 'statup'
          $bin = New-Item -ItemType Directory -Force (Join-Path $root 'bin')
          $data = New-Item -ItemType Directory -Force (Join-Path $root 'data')
          Copy-Item target\debug\statup.exe $bin
          Copy-Item static (Join-Path $bin 'static') -Recurse
          $folder = $data.FullName -replace '\\', '/'
          $settings = Join-Path $data 'statup.env'
          Set-Content $settings @(
            'HOST=127.0.0.1', 'PORT=3999', 'MONITORING=false', 'UPDATE_CHECK=false',
            "DATABASE_URL=sqlite:$folder/statup.db", "UPLOAD_DIR=$folder/uploads")
          New-Service -Name Statup -StartupType Manual `
            -BinaryPathName "`"$bin\statup.exe`" --env `"$settings`" service"
          $logFile = Join-Path $data 'statup.log'
          $answered = $false
          try {
            Start-Service Statup
            foreach ($try in 1..60) {
              try {
                Invoke-WebRequest http://127.0.0.1:3999/health -UseBasicParsing | Out-Null
                $answered = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            Stop-Service Statup
          } finally {
            if (Test-Path $logFile) { Get-Content $logFile } else { 'no statup.log' }
            Get-CimInstance Win32_Service -Filter "Name='Statup'" |
              Format-List State, ExitCode, ServiceSpecificExitCode
          }
          $log = Get-Content $logFile -Raw
          $service = Get-CimInstance Win32_Service -Filter "Name='Statup'"
          if (-not $answered) { throw 'Statup never answered on /health' }
          if ($service.State -ne 'Stopped') { throw "the service is $($service.State)" }
          if ($service.ExitCode -ne 0) { throw "the service stopped with code $($service.ExitCode)" }
          if ($log -notmatch 'Statup stopped') { throw 'the log does not show a clean stop' }

  # install.sh run for real on Ubuntu with systemd, from a release archive of
  # this build served by a local mirror: install with chosen folders,
  # account and port, use, update, uninstall. Only when the script, the
  # code or this workflow has changed; if the comparison fails, it runs.
  install-linux:
    name: Linux install script
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- src Cargo.toml Cargo.lock scripts/install.sh scripts/build-release.sh .github/workflows/ci.yml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.skip != 'true'
        run: shellcheck --shell=sh scripts/install.sh
      - if: steps.changes.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - name: Package this build as a release archive
        if: steps.changes.outputs.skip != 'true'
        run: |
          cargo build --locked
          curl -sSL -o tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tailwindcss
          mkdir -p bin/linux-x86_64
          cp target/debug/statup bin/linux-x86_64/
          scripts/build-release.sh --binaries bin
      - name: Install, use, update and remove Statup
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -u
          archive=$(ls dist/statup-*-linux-x86_64.tar.gz)
          version=$(basename "$archive" .tar.gz)
          version=${version#statup-}
          version=${version%-linux-x86_64}
          health() { curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "http://127.0.0.1:$1/health"; echo; }

          # The release files served as GitHub serves them, and a copy with
          # one byte changed in the archive.
          mkdir -p "mirror/v$version" "tampered/v$version"
          cp dist/* "mirror/v$version/"
          cp dist/* "tampered/v$version/"
          printf 'x' | dd of="tampered/v$version/$(basename "$archive")" bs=1 seek=4096 conv=notrunc
          python3 -m http.server 8000 >/dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null "http://127.0.0.1:8000/mirror/v$version/SHA256SUMS"

          echo "--- A changed archive is refused, and nothing is installed"
          if sudo sh scripts/install.sh --mirror "http://127.0.0.1:8000/tampered" --version "$version" --yes; then
            echo "the changed archive was installed"; exit 1
          fi
          test ! -e /etc/systemd/system/statup.service

          echo "--- Without a terminal nor --yes, it asks nothing and stops"
          code=0
          sudo sh scripts/install.sh --archive "$archive" < /dev/null || code=$?
          test "$code" = 2

          echo "--- Install through a pipe, with chosen folders, account and port"
          cat scripts/install.sh | sudo sh -s -- --mirror "http://127.0.0.1:8000/mirror" --version "$version" --yes \
            --prefix /opt/statup-ci --data-dir /srv/statup --backup-dir /srv/statup-backups \
            --port 3100 --listen local --user statupd
          systemctl is-enabled statup
          health 3100
          ss -ltnH | grep -q '127.0.0.1:3100'
          if ss -ltnH | grep -q '0.0.0.0:3100'; then echo "listens on every address"; exit 1; fi
          test "$(stat -c %U /srv/statup)" = statupd
          test "$(sudo stat -c %U:%a /etc/statup/statup.env)" = root:640

          echo "--- Another port, then a restart"
          sudo sed -i 's/^PORT=.*/PORT=3200/' /etc/statup/statup.env
          sudo systemctl restart statup
          health 3200

          echo "--- A backup made as root belongs to the account of the service"
          sudo statup backup
          backup=$(sudo ls /srv/statup-backups | grep '^statup-backup-' | head -n 1)
          test "$(sudo stat -c %U "/srv/statup-backups/$backup")" = statupd

          echo "--- Restore it, Statup stopped"
          sudo systemctl stop statup
          sudo statup restore "/srv/statup-backups/$backup" --yes
          sudo systemctl start statup
          health 3200

          echo "--- Run again: an update that keeps the settings"
          sudo sh scripts/install.sh --archive "$archive" --yes
          health 3200
          grep -q '^PORT=3200$' /etc/statup/statup.env
          test "$(cat /opt/statup-ci/VERSION)" = "$version"

          echo "--- Uninstall: the program goes, the data, settings and account stay"
          sudo sh scripts/install.sh --uninstall --yes
          test ! -e /etc/systemd/system/statup.service
          test ! -e /usr/local/bin/statup
          test ! -e /opt/statup-ci
          sudo test -f /srv/statup/statup.db
          sudo test -f /etc/statup/statup.env
          id statupd
      - if: failure()
        run: |
          sudo systemctl status statup --no-pager || true
          sudo journalctl -u statup --no-pager | tail -n 60 || true
          sudo cat /etc/statup/statup.env /etc/systemd/system/statup.service || true

  # Run by hand, the CI also builds the release archives, which a version
  # tag otherwise builds on its own.
  binaries:
    name: Release archives
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/binaries.yml

  # Built on each platform the release publishes, on a runner of its kind,
  # with the same cache as the release: once this has run on main, the
  # release build finds every layer ready.
  docker:
    name: Docker image builds (${{ matrix.platform }})
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On main, only when what the image is made from has changed: the pull
      # request built it already. If the comparison fails, it builds.
      - id: changes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --quiet "$BEFORE" HEAD -- Dockerfile .dockerignore docker-compose.yml Cargo.toml Cargo.lock; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      # Pull requests read the cache of main without writing their own.
      - if: steps.changes.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: statup:ci
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.runner) || '' }}

  # Builds the Nix package and boots the NixOS machine of flake.nix, which
  # starts the service and runs the commands of the NixOS page. Only when the
  # flake or the Rust dependencies have changed, what breaks a Nix build in
  # practice; if the comparison fails, it runs.
  nix:
    name: Nix package and NixOS service
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- flake.nix Cargo.toml Cargo.lock; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.skip != 'true'
        uses: cachix/install-nix-action@v31
      - if: steps.changes.outputs.skip != 'true'
        run: nix flake check --print-build-logs
