name: Bug report
description: Something does not work as it should.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard
        2. Click on ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown to administrators in Settings, or the tag of your Docker image.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Statup runs
      options:
        - Docker
        - Built from source
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For a display problem.
      placeholder: Firefox on a laptop, Safari on an iPhone
  - type: textarea
    id: logs
    attributes:
      label: Server output
      description: Anything relevant from the logs. Remove what you do not want public.
      render: text
